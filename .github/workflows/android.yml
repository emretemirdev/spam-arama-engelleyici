name: Android derleme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      # Lint bulgularını iş özetinde ve uyarı olarak göster (indirmeden okunabilsin).
      - name: Lint bulguları
        if: always()
        run: |
          f=app/build/reports/lint-results-debug.txt
          [ -f "$f" ] || { echo "Lint raporu yok"; exit 0; }
          tail -n 1 "$f"
          grep -E ": (Error|Warning): " "$f" | head -45 | while IFS= read -r line; do
            echo "::warning title=lint::${line}"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-ve-raporlar
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: ignore
